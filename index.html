
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivek Kasera | Official</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030303;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow: hidden;
}

.background {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center,
  #202020 0%, #090909 45%, #000 100%);
  z-index: -3;
}

.glow {
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  filter: blur(100px);
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  animation: pulse 5s infinite alternate;
  pointer-events: none;
}

@keyframes pulse {
  from { opacity: .3; transform: translateX(-50%) scale(.8); }
  to { opacity: 1; transform: translateX(-50%) scale(1.3); }
}

/* Rain */
.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.drop {
  position: absolute;
  width: 1px;
  height: 70px;
  background: linear-gradient(transparent, #aaa);
  opacity: .25;
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(110vh); }
}

/* Lightning flash */
.lightning {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 2;
}

.lightning.flash {
  animation: lightningFlash .45s ease-out;
}

@keyframes lightningFlash {
  0% { opacity: 0; }
  10% { opacity: .65; }
  20% { opacity: .05; }
  35% { opacity: .4; }
  50% { opacity: 0; }
  100% { opacity: 0; }
}

/* Content */
.container {
  height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.welcome {
  font-size: 11px;
  letter-spacing: 8px;
  color: #aaa;
  animation: fade 2s ease;
}

h1 {
  font-size: clamp(35px, 9vw, 85px);
  font-weight: 800;
  letter-spacing: 5px;
  margin: 30px 0;
  text-shadow: 0 0 10px white, 0 0 30px #888;
  animation: nameGlow 3s infinite alternate, fade 2s ease;
}

@keyframes nameGlow {
  from { text-shadow: 0 0 10px #aaa, 0 0 25px #555; }
  to { text-shadow: 0 0 20px white, 0 0 50px #777; }
}

.line {
  height: 1px;
  width: 120px;
  background: linear-gradient(90deg, transparent, white, transparent);
  margin-bottom: 25px;
}

.subtitle {
  font-size: 12px;
  color: #aaa;
  letter-spacing: 5px;
}

.button {
  display: inline-block;
  margin-top: 25px;
  padding: 13px 30px;
  border: 1px solid #777;
  color: white;
  background: transparent;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 3px;
  transition: .4s;
  position: relative;
  z-index: 5;
  cursor: pointer;
}

.button:hover {
  background: white;
  color: black;
  box-shadow: 0 0 25px white;
}

.instagram {
  border-color: #E1306C;
}

.instagram:hover {
  background: #E1306C;
  color: white;
  box-shadow: 0 0 25px #E1306C;
}

.sound {
  margin-top: 20px;
  padding: 9px 15px;
  color: #aaa;
  background: transparent;
  border: 1px solid #444;
  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
}

footer {
  position: absolute;
  bottom: 25px;
  color: #666;
  font-size: 10px;
  letter-spacing: 3px;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="glow"></div>
<div class="rain" id="rain"></div>
<div class="lightning" id="lightning"></div>

<div class="container">

  <div class="welcome">WELCOME TO MY WORLD</div>

  <h1>VIVEK KASERA</h1>

  <div class="line"></div>

  <div class="subtitle">
    DARKNESS
  </div>

  <a href="mailto:hello@example.com" class="button">
    CONTACT ME
  </a>

  <a href="https://www.instagram.com/vivek.kaseraa/"
     class="button instagram"
     target="_blank"
     rel="noopener noreferrer">
     MY INSTAGRAM
  </a>

  <footer>© 2026 VIVEK KASERA</footer>

</div>

<script>
// Rain effect
const rain = document.getElementById("rain");

for (let i = 0; i < 90; i++) {
  const drop = document.createElement("div");
  drop.className = "drop";
  drop.style.left = Math.random() * 100 + "%";
  drop.style.animationDuration = (0.5 + Math.random() * 1.5) + "s";
  drop.style.animationDelay = Math.random() * 3 + "s";
  rain.appendChild(drop);
}

// Thunder sound
let audioContext;
let soundEnabled = false;

const soundBtn = document.getElementById("soundBtn");

soundBtn.addEventListener("click", async () => {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  await audioContext.resume();

});

function playThunder() {
  if (!soundEnabled || !audioContext) return;

  const duration = 3;
  const buffer = audioContext.createBuffer(
    1, audioContext.sampleRate * duration,
    audioContext.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) *
      (1 - i / data.length);
  }

  const source = audioContext.createBufferSource();
  source.buffer = buffer;

  const filter = audioContext.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 160;

  const gain = audioContext.createGain();
  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.7, audioContext.currentTime + 0.15
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + duration
  );

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);

  source.start();
}

// Random lightning
const lightning = document.getElementById("lightning");

function strike() {
  lightning.classList.remove("flash");
  void lightning.offsetWidth;
  lightning.classList.add("flash");

  playThunder();

  setTimeout(() => {
    lightning.classList.remove("flash");
  }, 500);

  setTimeout(strike, 3000 + Math.random() * 7000);
}

setTimeout(strike, 2000);

</script>
<script>
let audioContext;

function playThunder() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const duration = 3;
  const buffer = audioContext.createBuffer(
    1,
    audioContext.sampleRate * duration,
    audioContext.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const source = audioContext.createBufferSource();
  source.buffer = buffer;

  const filter = audioContext.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 120;

  const gain = audioContext.createGain();
  gain.gain.setValueAtTime(0.001, audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(0.35, audioContext.currentTime + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);

  source.start();
}

document.addEventListener("click", function startSound() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  audioContext.resume();
  playThunder();

  document.removeEventListener("click", startSound);
});

function thunderLoop() {
  playThunder();
  setTimeout(thunderLoop, 8000 + Math.random() * 7000);
}

setTimeout(thunderLoop, 3000);
</script>
</body>
</body>
</html>
