<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030303;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow: hidden;
}

/* Animated background */
.background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 50%,
    #202020 0%, #090909 45%, #000 100%);
  z-index: -2;
}

.glow {
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  filter: blur(100px);
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  animation: pulse 5s infinite alternate;
}

@keyframes pulse {
  from { opacity: .3; transform: translateX(-50%) scale(.8); }
  to { opacity: 1; transform: translateX(-50%) scale(1.3); }
}

/* Rain */
.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.drop {
  position: absolute;
  width: 1px;
  height: 70px;
  background: linear-gradient(transparent, #aaa);
  opacity: .25;
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(110vh); }
}

/* Main content */
.container {
  height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.welcome {
  font-size: 11px;
  letter-spacing: 8px;
  color: #aaa;
  animation: fade 2s ease;
}

h1 {
  font-size: clamp(35px, 9vw, 85px);
  font-weight: 800;
  letter-spacing: 5px;
  margin: 30px 0;
  color: #fff;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #888,
    0 0 60px #555;
  animation: nameGlow 3s infinite alternate,
             fade 2s ease;
}

@keyframes nameGlow {
  from { text-shadow: 0 0 10px #aaa, 0 0 25px #555; }
  to { text-shadow: 0 0 20px white, 0 0 50px #777; }
}

.line {
  height: 1px;
  width: 120px;
  background: linear-gradient(90deg, transparent, white, transparent);
  margin-bottom: 25px;
  animation: expand 2s ease;
}

@keyframes expand {
  from { width: 0; }
  to { width: 120px; }
}

.subtitle {
  font-size: 12px;
  color: #aaa;
  letter-spacing: 5px;
  animation: fade 3s ease;
}

.button {
  margin-top: 40px;
  padding: 13px 30px;
  border: 1px solid #777;
  color: white;
  background: transparent;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 3px;
  transition: .4s;
}

.button:hover {
  background: white;
  color: black;
  box-shadow: 0 0 25px white;
}

footer {
  position: absolute;
  bottom: 25px;
  color: #666;
  font-size: 10px;
  letter-spacing: 3px;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="rain" id="rain"></div>

    MY LIFE. MY RULES. MY WORLD.
  </div>

  <a href="mailto:hello@example.com" class="button">
    CONTACT ME
  </a>

  <footer>© 2026 VIVEK KASERA</footer>
</div>

<script>
const rain = document.getElementById("rain");

for (let i = 0; i < 65; i++) {
  const drop = document.createElement("div");
  drop.className = "drop";
  drop.style.left = Math.random() * 100 + "%";
  drop.style.animationDuration =
    (0.5 + Math.random() * 1.5) + "s";
  drop.style.animationDelay =
    Math.random() * 3 + "s";
  rain.appendChild(drop);
}
</script>
